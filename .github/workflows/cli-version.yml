name: Version CLI

on:
  # Trigger the workflow every time you push to the `trunk` branch
  push:
    branches: [trunk]
    # filter to only run when changes are made to `./packages/cli/**`
    paths:
      # only run on change to packages/cli
      - "packages/cli/**"
        # exclude files auto-updated by a Versions PR to prevent this workflow from looping infinitely
      - "!packages/cli/package.json"
      - "!packages/cli/CHANGELOG.md"
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Allows pushing commits/PRs to the repository
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false # turn off GITHUB_TOKEN

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          check-latest: true
          cache: "pnpm"

      - name: Create Version Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm dlx @changesets/cli version
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_GITHUB_FGPAT }}
